name: upper-build
on:
    push:
        paths:
            - '.github/workflows/upper-build.yml'
            - 'upper/**'
    workflow_dispatch: #manual

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - run: pwd && ls -al
            - uses: actions/checkout@v4
            - run: pwd && ls -al
            - run: go version
            - uses: actions/setup-go@v5
              with:
                  go-version: '1.22'
            - run: go version
            - name: multi-line script
              shell: bash
              run: |
                cd upper
                echo "current directory: $(pwd)"
                go build -o upper
                echo "change permissions to executable"
                chmod +x upper
                echo "running upper..."
                ./upper foo the bar
